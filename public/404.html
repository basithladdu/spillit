<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#C2185B">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found &mdash; Spill It</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff5f9; color: #17121f; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #f4d8ff 0, transparent 38%), #fff5f9; }
      main { width: min(100%, 520px); padding: 48px 32px; text-align: center; background: #fff; border: 2px solid #17121f; border-radius: 32px; box-shadow: 8px 8px 0 #17121f; }
      .mark { width: 72px; height: 72px; margin: 0 auto 24px; display: grid; place-items: center; border: 2px solid #17121f; border-radius: 50%; background: #C2185B; color: #fff; font-size: 32px; font-weight: 800; }
      .code { margin: 0; color: #C2185B; font-size: 14px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(2rem, 8vw, 4rem); line-height: 1; letter-spacing: -.05em; }
      p { margin: 0 auto 28px; max-width: 36ch; color: #635a6d; line-height: 1.6; }
      a { display: inline-block; padding: 14px 24px; border: 2px solid #17121f; border-radius: 999px; background: #C2185B; color: #fff; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #17121f; transition: transform .2s ease, box-shadow .2s ease; }
      a:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #17121f; }
      a:focus-visible { outline: 4px solid #f59ee1; outline-offset: 4px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">&#9829;</div>
      <p class="code">404 &middot; Spill It</p>
      <h1>Lost in the map.</h1>
      <p>This page was never spilled, or it has moved somewhere else.</p>
      <a href="/">Return to the map</a>
    </main>
  </body>
</html>
